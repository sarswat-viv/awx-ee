---
- name: Test Azure Key Vault Secret Retrieval
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - keyvault_url is defined
          - keyvault_url | length > 0
          - secret_name is defined
          - secret_name | length > 0
        fail_msg: "Required variables keyvault_url and secret_name are missing."

    - name: Fetch secret from Azure Key Vault
      ansible.builtin.shell: |
        python3 <<'PY'
        import os

        from azure.identity import DefaultAzureCredential
        from azure.keyvault.secrets import SecretClient

        credential = DefaultAzureCredential()

        client = SecretClient(
            vault_url=os.environ["KEYVAULT_URL"],
            credential=credential
        )

        secret = client.get_secret(
            os.environ["SECRET_NAME"]
        )

        print(secret.value)
        PY
      args:
        executable: /bin/bash
      environment:
        KEYVAULT_URL: "{{ keyvault_url }}"
        SECRET_NAME: "{{ secret_name }}"
      register: keyvault_result
      changed_when: false

    - name: Show retrieved secret - TESTING ONLY
      ansible.builtin.debug:
        msg: "Secret value: {{ keyvault_result.stdout }}"