name: Build and Push Custom AWX EE

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build custom AWX EE image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/awx-ee:1.0.0 -f Dockerfile .

      - name: Verify SDKs and Git credential helper
        run: |
          docker run --rm --user 1000 ${{ secrets.DOCKERHUB_USERNAME }}/awx-ee:1.0.0 \
            bash -c "python3 -c 'import azure.identity, azure.keyvault.secrets; print(\"SDK_OK\")' && git config --system --list | grep credential"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/awx-ee:1.0.0